<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="common-plastic-noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.28  0 0 0 0 0.20  0 0 0 0.35 0" />
  </filter>
  <rect width="180" height="180" filter="url(#common-plastic-noise)" opacity="0.55" />
</svg>
